[project]
name = "to-do-list-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RogerPierre", email = "rogerpierrereis@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anyio>=4.15.1",
    "fastapi[standard]>=0.141.1",
    "starlette>=1.7.0",
]

[project.scripts]
to-do-list-api = "to_do_list_api:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
